# 3X-UI Clash / Mihomo 远程路由模板
# Hrules 提供场景规则集，DustinWin 提供广告和国内游戏规则集。
proxy-groups:
  - name: "PROXY"
    type: select
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'
    empty-fallback: REJECT

  - name: "⚡ 最低延迟"
    type: url-test
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'
    empty-fallback: REJECT
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 300
    timeout: 5000
    tolerance: 50

  - name: "🌐 海外应用"
    type: select
    proxies:
      - "PROXY"
      - "⚡ 最低延迟"
      - "DIRECT"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "▶ YouTube"
    type: select
    proxies:
      - "PROXY"
      - "⚡ 最低延迟"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "📺 流媒体"
    type: select
    proxies:
      - "PROXY"
      - "⚡ 最低延迟"
      - "DIRECT"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "🤖 AI 服务"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "💳 金融服务"
    type: select
    proxies:
      - "PROXY"
      - "DIRECT"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "PROXY"
      - "⚡ 最低延迟"
      - "DIRECT"
    include-all: true
    exclude-filter: '(?i)^(剩余流量|流量剩余|剩余|套餐到期|订阅到期|到期时间|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage)(\s|[：:|｜]|$)'

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - PASS

